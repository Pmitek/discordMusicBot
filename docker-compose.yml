services:
  discord-music-bot:
    build: .
    image: discord-music-bot:latest
    container_name: discord-music-bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      # Optional YouTube cookies (recommended in Docker; don't commit cookies.txt):
      - YTDL_COOKIES=/cookies/cookies.txt
    volumes:
      - /home/pit/projects/discordMusicBot/cookies:/cookies/:ro
